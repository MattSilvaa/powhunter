global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['__ALERTMANAGER_TARGET__']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Each placeholder below is replaced at start-up by entrypoint.sh, because
  # Prometheus expands no environment variables of its own. The addresses differ
  # per environment and cannot be hardcoded: Render appends a generated suffix to
  # a service's internal hostname and exposes it on port 10000, so the obvious
  # "pushgateway:9091" resolves to nothing. render.yaml asks Render for each
  # address with fromService rather than guessing.
  - job_name: powhunter-api
    metrics_path: /metrics
    # /metrics is no longer public. The token is written to this file from the
    # METRICS_TOKEN environment variable, so it never enters the image.
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['__API_TARGET__']
        labels:
          service: api

  # The forecaster is a one-shot job, so it pushes rather than being scraped.
  - job_name: powhunter-forecaster
    honor_labels: true
    static_configs:
      - targets: ['__PUSHGATEWAY_TARGET__']
        labels:
          service: forecaster
