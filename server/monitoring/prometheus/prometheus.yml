global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # __API_TARGET__ is replaced at start-up by entrypoint.sh: the API runs on the
  # host under compose and as a neighbouring service on Render, and Prometheus
  # expands no environment variables of its own.
  - job_name: powhunter-api
    metrics_path: /metrics
    # /metrics is no longer public. The token is written to this file from the
    # METRICS_TOKEN environment variable, so it never enters the image.
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['__API_TARGET__']
        labels:
          service: api

  # The forecaster is a one-shot job, so it pushes rather than being scraped.
  - job_name: powhunter-forecaster
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: forecaster
