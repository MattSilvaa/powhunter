global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: powhunter-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api

  # The forecaster is a one-shot job, so it pushes rather than being scraped.
  - job_name: powhunter-forecaster
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: forecaster
