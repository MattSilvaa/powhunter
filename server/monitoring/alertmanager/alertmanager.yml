# Alertmanager needs a real receiver to be useful. Set ALERT_WEBHOOK_URL to a
# Slack incoming webhook, an email relay, or a paging integration before relying
# on this: with an unroutable receiver, alerts fire and are silently dropped.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

inhibit_rules:
  # While the API is completely down, its latency and error-rate alerts are noise.
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - service = "api"
    equal: ['service']
