# Alertmanager needs a real receiver to be useful. Set ALERT_WEBHOOK_URL to a
# Slack incoming webhook, an email relay, or a paging integration before relying
# on this: with an unroutable receiver, alerts fire and are silently dropped.
#
# __ALERT_WEBHOOK_URL__ is replaced at start-up by entrypoint.sh. Alertmanager
# does not expand environment variables, so referencing ${ALERT_WEBHOOK_URL}
# here directly would post every alert to that literal string.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # slack_configs rather than webhook_configs: a Slack incoming webhook
    # rejects Alertmanager's own JSON with invalid_payload, so a generic webhook
    # would fire and silently fail to deliver. This formats the message the way
    # Slack expects.
    slack_configs:
      - api_url: '__ALERT_WEBHOOK_URL__'
        # The incoming webhook already targets a channel; this is the label
        # Alertmanager requires and what Slack shows if the hook allows an
        # override.
        channel: '#alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }}
          {{ .Annotations.description }}{{ end }}
          {{ end }}

inhibit_rules:
  # While the API is completely down, its latency and error-rate alerts are noise.
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - service = "api"
    equal: ['service']
