name: powhunter

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-powhunter}
    ports:
      # Bound to the loopback interface so the development database is not
      # exposed on every interface of the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    # Built rather than pulled so local runs exactly what Render builds: the
    # entrypoint resolves the scrape token and the API address, which the stock
    # image cannot do.
    build: ./monitoring/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      API_TARGET: ${API_TARGET:-host.docker.internal:8080}
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Lets Prometheus scrape the API running directly on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    build: ./monitoring/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0-slim
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Points at the compose Prometheus by default; override to a tunnelled
      # production Prometheus. See monitoring/README.md.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
