name: Test

# Runs on every pull request, and as the first stage of deploy.yml for every
# push to main, so main is checked once and deployed only if this passes.
on:
  pull_request:
  workflow_call:

# Only pull requests cancel superseded runs. Under deploy.yml, the deploy
# workflow's own concurrency group decides what runs.
concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powhunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Unit tests
        working-directory: server
        run: go test -race ./...

      # POWHUNTER_TEST_DB makes an unreachable database a hard failure instead of
      # a skip, so this job cannot report green without actually exercising the DB.
      - name: Integration tests
        working-directory: server
        env:
          POWHUNTER_TEST_DB: "1"
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: powhunter_test
        run: go test -race -tags=integration -count=1 ./...

  lint:
    name: Server lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # .golangci.yml is a deliberately strict config that the existing code does
      # not yet satisfy. Gate only newly written code so the config can stay strict
      # without requiring a big-bang cleanup first.
      # v7 is the first release that accepts golangci-lint v2; v6 rejects the
      # version outright and the step never runs a single check.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: server
          args: --timeout=5m --new-from-rev=origin/main

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than "latest": a new bun release rewrites the lockfile
      # format, which makes --frozen-lockfile below fail on a branch that
      # changed nothing. Bump this deliberately, with the lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Starts the real API, database and web build on the runner and drives them
  # like a user would. The same suite runs against production after a deploy,
  # minus the tests that write data.
  functional:
    name: Functional
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: powhunter
      PORT: "8080"
      ALLOWED_ORIGINS: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      RENDER_GIT_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Build
        working-directory: server
        run: |
          go build -o bin/powhunter ./cmd/api
          go build -o bin/migrate ./cmd/migrate

      # The same migration step a deploy runs, against an empty database.
      - name: Migrate
        working-directory: server
        run: ./bin/migrate

      # No RESEND_API_KEY, so emails (including sign-in links) go to this log,
      # which is how the tests sign in.
      - name: Start API
        working-directory: server
        run: |
          ./bin/powhunter > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build and serve web app
        working-directory: client
        env:
          VITE_BASE_SERVER_URL: http://localhost:8080
        run: |
          bun install --frozen-lockfile
          bun run build
          bun x serve@14 build/client -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fs http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Functional tests
        working-directory: server
        env:
          FUNCTIONAL_API_URL: http://localhost:8080
          FUNCTIONAL_WEB_URL: http://localhost:3000
          FUNCTIONAL_EXPECT_COMMIT: ${{ github.sha }}
          FUNCTIONAL_MAIL_LOG: ${{ runner.temp }}/api.log
        run: go test -tags=functional -count=1 -v ./functional

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
