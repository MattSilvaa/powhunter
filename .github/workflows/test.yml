name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powhunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Unit tests
        working-directory: server
        run: go test -race ./...

      # POWHUNTER_TEST_DB makes an unreachable database a hard failure instead of
      # a skip, so this job cannot report green without actually exercising the DB.
      - name: Integration tests
        working-directory: server
        env:
          POWHUNTER_TEST_DB: "1"
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: powhunter_test
        run: go test -race -tags=integration -count=1 ./...

  lint:
    name: Server lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # .golangci.yml is a deliberately strict config that the existing code does
      # not yet satisfy. Gate only newly written code so the config can stay strict
      # without requiring a big-bang cleanup first.
      # v7 is the first release that accepts golangci-lint v2; v6 rejects the
      # version outright and the step never runs a single check.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: server
          args: --timeout=5m --new-from-rev=origin/main

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than "latest": a new bun release rewrites the lockfile
      # format, which makes --frozen-lockfile below fail on a branch that
      # changed nothing. Bump this deliberately, with the lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
